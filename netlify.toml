[build]
    command = "npm run build" # how to trigger a build
    publish = "/config/dist" # what folder to publish

    [build.environment]
        NODE_VERSION = "22" # the new packages need Node 18 or newer

[[redirects]]
    from = "/*" # redirect any path
    to = "/index.html" # to this html page
    status = 200 # with this status